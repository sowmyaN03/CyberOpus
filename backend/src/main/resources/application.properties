# =============================================================
# CyberOpus – Application Properties
# =============================================================
# All secrets are loaded from environment variables.
# See .env.example for variable names. Never commit real secrets.

# ---------------------------------------------------------------
# Server
# ---------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------
# PostgreSQL Datasource
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cyberopus}
spring.datasource.username=${DB_USERNAME:cyberopus_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------
# JWT
# ---------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:cyberopus-super-secret-key-must-be-at-least-32-chars-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------
# Reward Points Configuration
# ---------------------------------------------------------------
# Points earned per whole currency unit spent (e.g. 10 pts per $1)
app.rewards.earn-rate=${REWARDS_EARN_RATE:10}
# Points required per whole currency unit redeemed (e.g. 100 pts = $1)
app.rewards.redeem-rate=${REWARDS_REDEEM_RATE:100}
# Maximum proportion of order subtotal redeemable as points (0.20 = 20%)
app.rewards.max-redeem-pct=${REWARDS_MAX_REDEEM_PCT:0.20}

# ---------------------------------------------------------------
# Delivery Configuration
# ---------------------------------------------------------------
app.delivery.charge=${DELIVERY_CHARGE:4.99}
# Business days added to today to compute tentative delivery date
app.delivery.business-days=${DELIVERY_BUSINESS_DAYS:5}

# ---------------------------------------------------------------
# CORS
# ---------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ---------------------------------------------------------------
# OpenAPI / Swagger
# ---------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=alpha
