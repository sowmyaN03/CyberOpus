# =============================================================
# CyberOpus – Test Properties (H2 in-memory)
# =============================================================
spring.datasource.url=jdbc:h2:mem:cyberopus_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.flyway.enabled=false

app.jwt.secret=test-secret-key-that-is-at-least-32-chars-long-for-hmac
app.jwt.expiration-ms=3600000

app.rewards.earn-rate=10
app.rewards.redeem-rate=100
app.rewards.max-redeem-pct=0.20

app.delivery.charge=4.99
app.delivery.business-days=5

app.cors.allowed-origins=http://localhost:3000
